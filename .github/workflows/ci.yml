name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest + Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lastik
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: lastik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastik -d lastik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lastik_test
      DB_USERNAME: lastik
      DB_PASSWORD: secret
      DB_URL: ""
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DEFAULT_TENANT_SLUG: acceptance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql, redis, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel .env
        run: |
          cp .env.example .env 2>/dev/null || true
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=', file_get_contents('.env') ?: ''));"
          php artisan key:generate --force

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U lastik -d lastik_test; do sleep 1; done

      - name: Run Pest tests
        run: php artisan test --compact

      - name: Laravel Pint (style gate)
        run: vendor/bin/pint --test
