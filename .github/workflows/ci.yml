name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pest) + Lint + Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lastik_test
          POSTGRES_USER: lastik
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lastik"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, intl, gd
          coverage: none

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare env
        run: |
          # .env.testing already has CI DB/Redis credentials (lastik_test / secret).
          # Do NOT rely on a truncated .env.example — that broke migrate on CI #50–#52.
          cp .env.testing .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=lastik_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=lastik/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=secret/' .env
          grep -q '^DB_ROLE_ENFORCE=' .env || echo 'DB_ROLE_ENFORCE=false' >> .env
          php artisan key:generate --force

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lastik_test
          DB_USERNAME: lastik
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run backend tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lastik_test
          DB_USERNAME: lastik
          DB_PASSWORD: secret
          MARKING_MOCK_MODE: 'true'
        run: php artisan test --stop-on-failure

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend deps
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          test -d node_modules/@vitejs/plugin-vue
          npx vite build

  e2e:
    name: Playwright E2E (system Chrome)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend deps
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: Install system Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npx playwright test --reporter=line

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
