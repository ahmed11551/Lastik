services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastik
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lastik
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastik -d lastik"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lastik_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host 6380 — avoid clash with other local Redis on 6379; in-network still redis:6379
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lastik_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastik_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment: &app_env
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: lastik
      DB_USERNAME: lastik
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lastik_network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastik_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    # Legacy worker kept for fallback; prefer `horizon` service in v1.2+.
    command: php artisan queue:work redis --queue=default,stock-reservations,marking-sync --sleep=1 --tries=3 --max-time=3600 --timeout=120
    profiles: ["legacy-queue"]
    volumes:
      - .:/var/www/html
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lastik_network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastik_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      <<: *app_env
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lastik_network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastik_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    volumes:
      - .:/var/www/html
    environment:
      <<: *app_env
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8081"
      REVERB_HOST: localhost
      REVERB_PORT: "8081"
      REVERB_SCHEME: http
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lastik_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastik_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lastik_network

  webserver:
    image: nginx:alpine
    container_name: lastik_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - lastik_network

volumes:
  pgdata:
  redisdata:

networks:
  lastik_network:
    driver: bridge
